<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counterparty record — Horos</title>
<meta name="description" content="The public payment lineage of a counterparty: every account it has been paid at, and every signature behind each change.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#2d3142">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/">Horos</a>
    <p class="tagline">Public record. No signup, no key, read-only.</p>
    <div class="picker">
      <label for="network">Chain</label>
      <select id="network" hidden></select>
      <span class="custody" data-custody></span>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="record" hidden></section>
</main>

<script src="/counterparty.js" type="module"></script>
</body>
</html>
