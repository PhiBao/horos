      #horos-refusal-ceremony-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #horos-refusal-ceremony-root .diagram-container { width: 100%; overflow-x: auto; }
      #horos-refusal-ceremony-root .diagram-container { overflow-x: visible; }</style>
