<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="horos-refusal-ceremony-title horos-refusal-ceremony-desc" id="horos-refusal-ceremony-root">
        <title id="horos-refusal-ceremony-title">Refusal, then ceremony</title>
        <desc id="horos-refusal-ceremony-desc">A redirected invoice is refused without a call; the genuine move needs two signatures the recipient cannot supply.</desc>
