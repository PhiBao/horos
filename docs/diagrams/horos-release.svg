<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="horos-release-title horos-release-desc" id="horos-release-root">
        <title id="horos-release-title">Release — the ordinary invoice</title>
        <desc id="horos-release-desc">Seven messages release an invoice to the address on record; the registry answers payable and the money follows.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #horos-release-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #horos-release-root .diagram-container { width: 100%; overflow-x: auto; }
      #horos-release-root .diagram-container { overflow-x: visible; }</style>
          <marker id="horos-release-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="horos-release-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="horos-release-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<!-- Actor: Business -->
        <rect x="40" y="96" width="100" height="54" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="96" width="100" height="54" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="90" y="119" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Business</text>
        <text x="90" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sends invoice</text>
        <line x1="90" y1="150" x2="90" y2="516" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <!-- Actor: Agent -->
        <rect x="235" y="96" width="100" height="54" rx="6" fill="#f5f5f5"/>
        <rect x="235" y="96" width="100" height="54" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="285" y="119" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent</text>
        <text x="285" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no key</text>
        <line x1="285" y1="150" x2="285" y2="516" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <!-- Actor: Registry -->
        <rect x="430" y="96" width="100" height="54" rx="6" fill="#f5f5f5"/>
        <rect x="430" y="96" width="100" height="54" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="480" y="119" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Registry</text>
        <text x="480" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">durable record</text>
        <line x1="480" y1="150" x2="480" y2="516" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <!-- Actor: Circle -->
        <rect x="625" y="96" width="100" height="54" rx="6" fill="#f5f5f5"/>
        <rect x="625" y="96" width="100" height="54" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="675" y="119" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Circle</text>
        <text x="675" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">custody · signs</text>
        <line x1="675" y1="150" x2="675" y2="516" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <!-- Actor: Vault -->
        <rect x="820" y="96" width="100" height="54" rx="6" fill="#f5f5f5"/>
        <rect x="820" y="96" width="100" height="54" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="870" y="119" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vault</text>
        <text x="870" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">holds USDC</text>
        <line x1="870" y1="150" x2="870" y2="516" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <rect x="866" y="374" width="8" height="92" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="476" y="420" width="8" height="46" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <line x1="140" y1="190" x2="235" y2="190" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#horos-release-arrow)"/>
        <rect x="162.5" y="170" width="50" height="12" rx="2" fill="#f5f5f5"/>
        <text x="187.5" y="179" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVOICE</text>
        <line x1="335" y1="236" x2="430" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#horos-release-arrow)"/>
        <rect x="340" y="216" width="85" height="12" rx="2" fill="#f5f5f5"/>
        <text x="382.5" y="225" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACTIVE ACCOUNT</text>
        <line x1="430" y1="282" x2="335" y2="282" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#horos-release-arrow)"/>
        <rect x="347.5" y="262" width="70" height="12" rx="2" fill="#f5f5f5"/>
        <text x="382.5" y="271" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PAID BEFORE</text>
        <line x1="335" y1="328" x2="625" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#horos-release-arrow)"/>
        <rect x="367.5" y="308" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="382.5" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PAY</text>
        <line x1="625" y1="374" x2="820" y2="374" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#horos-release-arrow)"/>
        <rect x="740" y="354" width="65" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772.5" y="363" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNED PAY</text>
        <line x1="820" y1="420" x2="530" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#horos-release-arrow)"/>
        <rect x="740" y="400" width="65" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772.5" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IS PAYABLE</text>
        <line x1="530" y1="466" x2="820" y2="466" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#horos-release-arrow-accent)"/>
        <rect x="755" y="446" width="35" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772.5" y="455" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRUE</text>
        <rect x="110" y="482" width="720" height="30" rx="4" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="470" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">vault.pay(counterpartyId, amount, ref) — no address parameter</text>
        <text x="470" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">USDC goes to the recorded account</text>
        <line x1="30" y1="524" x2="930" y2="524" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <line x1="60" y1="541" x2="100" y2="541" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#horos-release-arrow)"/>
        <text x="112" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CALLS</text>
        <line x1="197" y1="541" x2="237" y2="541" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#horos-release-arrow)"/>
        <text x="249" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURNS</text>
        <line x1="344" y1="541" x2="384" y2="541" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#horos-release-arrow-accent)"/>
        <text x="396" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HEADLINE · PAYABLE</text>
        <rect x="557" y="531" width="8" height="20" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="598" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HOLDS CONTROL</text>      </svg>
